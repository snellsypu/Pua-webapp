crons:
  - name: routine-reminders
    description: "Sends the wake-up notification and morning/bedtime routine push notifications when their set times arrive"
    cron: "*/5 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/routines"
    method: POST
    enabled: true

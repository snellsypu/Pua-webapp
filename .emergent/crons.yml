crons:
  - name: routine-reminders
    description: "Sends morning and bedtime routine push notifications when their set time arrives"
    cron: "*/15 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/routines"
    method: POST
    enabled: true
